<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Resume Screening System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>AI Resume Screening &amp; Job Recommendation System</h1>
        <p class="subtitle">Smarter hiring starts with intelligent screening.</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="flashes">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('upload') }}" method="post" enctype="multipart/form-data">
            <label for="resume">Upload your resume (PDF or DOCX):</label>
            <input type="file" name="resume" id="resume" accept=".pdf,.docx" required>
            <button type="submit">Analyze Resume</button>
        </form>
    </div>
</body>
</html>
